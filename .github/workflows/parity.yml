name: Parity Tests

on:
  push:
    branches: [ 5.2, "migration/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  perl:
    name: Parity harness against Perl and Python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the harness dependencies
        run: make parity-deps
      - name: Start the Perl app
        run: docker compose up -d --build
      - name: Wait for the REST API
        run: |
          for i in $(seq 1 90); do
            # /version answers before checksetup.pl has created the administrator, so wait for a login.
            if curl -fsS -o /dev/null -G http://127.0.0.1:8080/rest.cgi/login \
                 --data-urlencode 'login=admin@bugzilla.test' --data-urlencode 'password=password01!'; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Seed demo data
        run: make seed
      - name: Wait for the Python service
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/rest.cgi/bug/1; then exit 0; fi
            sleep 2
          done
          docker compose logs bugzilla5.api
          exit 1
      - name: Run the parity suite against Perl
        run: make parity TARGET=perl PYTEST_ARGS="-v"
      - name: Run the parity suite against Python
        run: make parity TARGET=python PYTEST_ARGS="-v"
      - name: Check that Apache routes the Bug module to Python and the rest to Perl
        run: |
          set -euo pipefail
          backend() { curl -fsS -D - -o /dev/null "$@" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-bugzilla-backend"{print $2}'; }
          test "$(backend http://127.0.0.1:8080/rest.cgi/bug/1)" = python
          test -z "$(backend http://127.0.0.1:8080/rest.cgi/version)"
          test -z "$(backend -H 'X-Bugzilla-Backend: perl' http://127.0.0.1:8080/rest.cgi/bug/1)"
      - name: Run the parity suite through Apache (bug routes proxied to Python)
        run: make parity TARGET=python PYTHON_BASE_URL=http://127.0.0.1:8080/rest.cgi PYTEST_ARGS="-q"
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 200
