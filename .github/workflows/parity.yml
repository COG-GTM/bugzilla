name: REST parity (Perl)

on:
  push:
    branches: [ 5.2, migration/python ]
  pull_request:
  workflow_dispatch:

jobs:
  parity-perl:
    name: Contract suite against the Perl app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parity/requirements.txt

      - name: Build and start Bugzilla (Perl + MariaDB)
        run: docker compose up -d --build

      - name: Wait for checksetup
        run: |
          for i in $(seq 1 90); do
            if docker compose logs bugzilla5.web 2>/dev/null | grep -q "Checksetup completed."; then
              echo "ready after ${i} polls"; exit 0
            fi
            sleep 5
          done
          echo "Bugzilla did not come up in time"; docker compose logs; exit 1

      - name: Install parity dependencies
        run: make parity-deps

      - name: Seed demo data through the REST API
        run: make seed TARGET=perl

      - name: Run parity suite against Perl
        run: make parity TARGET=perl PYTEST_ARGS="-v --junitxml=parity-results.xml"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: parity/parity-results.xml
          if-no-files-found: ignore

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200
