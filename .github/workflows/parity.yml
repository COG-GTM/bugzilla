name: REST parity (Perl and Python)

on:
  push:
    branches: [ 5.2, migration/python ]
  pull_request:
  workflow_dispatch:

jobs:
  parity-perl:
    name: parity suite against the Perl app
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Bugzilla (docker compose)
        run: docker compose up -d --build bugzilla5.web bugzilla5.db

      - name: Wait for checksetup
        run: |
          for i in $(seq 1 120); do
            if docker compose logs bugzilla5.web 2>/dev/null | grep -q "Checksetup completed"; then
              break
            fi
            sleep 5
          done
          docker compose logs bugzilla5.web | grep -q "Checksetup completed" || { docker compose logs; exit 1; }
          curl -fsS http://127.0.0.1:8080/rest.cgi/version

      - name: Install parity dependencies
        run: make parity-deps

      - name: Seed demo data
        run: make seed

      - name: Run parity suite against Perl
        run: make parity TARGET=perl PYTEST_ARGS="--junitxml=parity-perl.xml -rA"

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse("parity-perl.xml").getroot().find("testsuite")
          total, fail, err, skip = (int(s.get(k)) for k in ("tests", "failures", "errors", "skipped"))
          print(f"## Parity vs Perl\n\n| tests | passed | failed | errors | skipped |\n|---|---|---|---|---|\n| {total} | {total-fail-err-skip} | {fail} | {err} | {skip} |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-perl-junit
          path: parity-perl.xml

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

  parity-python:
    name: parity suite against the Python service
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Bugzilla + Python service (docker compose)
        run: docker compose up -d --build

      - name: Wait for checksetup and the Python service
        run: |
          for i in $(seq 1 120); do
            if docker compose logs bugzilla5.web 2>/dev/null | grep -q "Checksetup completed"; then
              break
            fi
            sleep 5
          done
          docker compose logs bugzilla5.web | grep -q "Checksetup completed" || { docker compose logs; exit 1; }
          curl -fsS http://127.0.0.1:8080/rest.cgi/version
          curl -fsS http://127.0.0.1:8000/healthz

      - name: Install parity dependencies
        run: make parity-deps

      - name: Seed demo data (through Perl)
        run: make seed

      - name: Run parity suite against Python
        run: make parity TARGET=python PYTEST_ARGS="--junitxml=parity-python.xml -rA"

      - name: Apache strangler cutover (BZ_PYTHON_UPSTREAM) and parity through the proxy
        run: |
          BZ_PYTHON_UPSTREAM=http://bugzilla5.python:8000 docker compose up -d bugzilla5.web
          for i in $(seq 1 120); do
            if docker compose logs --since 5m bugzilla5.web 2>/dev/null | grep -q "Checksetup completed"; then
              break
            fi
            sleep 5
          done
          curl -fsSi http://127.0.0.1:8080/rest.cgi/bug/1 | grep -i '^x-bugzilla-backend: python'
          # every prefix listed in docker/python-proxy-routes.d/*.txt must reach the Python service
          # (header "python", or "perl-fallback" when Python forwards it): no header means Apache kept it on Perl
          for prefix in $(cat docker/python-proxy-routes.d/*.txt | grep -vE '^\s*(#|$)'); do
            # capture first: with pipefail, grep -q closing the pipe early would SIGPIPE curl on large bodies
            headers=$(curl -si "http://127.0.0.1:8080/rest.cgi/$prefix" | sed '/^\r*$/q')
            printf '%s\n' "$headers" | grep -qi '^x-bugzilla-backend:' \
              || { echo "proxy rule for '$prefix' not applied"; exit 1; }
          done
          curl -fsSi http://127.0.0.1:8080/rest.cgi/version | grep -i '^x-bugzilla-backend: python' >/dev/null && { echo "/version must stay on Perl"; exit 1; }
          # an unported Bug resource must reach Perl through the Python fallback (:8081), not loop or 404
          curl -si http://127.0.0.1:8080/rest.cgi/bug/comment/tags/parity | grep -i '^x-bugzilla-backend: perl-fallback'
          make parity BASE_URL=http://127.0.0.1:8080/rest.cgi PYTEST_ARGS="-q"

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse("parity-python.xml").getroot().find("testsuite")
          total, fail, err, skip = (int(s.get(k)) for k in ("tests", "failures", "errors", "skipped"))
          print(f"## Parity vs Python\n\n| tests | passed | failed | errors | skipped |\n|---|---|---|---|---|\n| {total} | {total-fail-err-skip} | {fail} | {err} | {skip} |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-python-junit
          path: parity-python.xml

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200
