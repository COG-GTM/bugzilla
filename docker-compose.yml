version: '3.6'

services:
  bugzilla5.web:
    build:
      context: .
      dockerfile: Dockerfile
    command: /root/docker/startup.sh
    volumes:
      - bugzilla5-data-dir:/var/www/html/data
      - .:/mnt/sync
    tmpfs:
      - /tmp
      - /run/lock
    ports:
      - 8080:80
    depends_on:
      - bugzilla5.db
    environment: &bugzilla_env
      - BZ_ADMIN_EMAIL=admin@bugzilla.test
      - BZ_ADMIN_PASSWORD=password01!
      - BZ_ADMIN_REALNAME=Test Admin
      - BZ_URLBASE=http://127.0.0.1:8080/
      - BZ_DB_HOST=bugzilla5.db
      - BZ_DB_PORT=3306
      - BZ_DB_USER=bugs
      - BZ_DB_NAME=bugs
      - BZ_DB_PASS=bugzilla
      - MARIADB_ROOT_HOST=%
      - MARIADB_ROOT_PASSWORD=bugzilla

  # Python port (strangler). Same MariaDB, Perl's data/ directory read-only.
  bugzilla5.api:
    build:
      context: ./python
    volumes:
      - bugzilla5-data-dir:/var/www/html/data:ro
    ports:
      # Loopback only: clients use Apache on :8080; this port is for the parity suite.
      - 127.0.0.1:8000:8000
    depends_on:
      - bugzilla5.db
    environment:
      - BZ_DB_HOST=bugzilla5.db
      - BZ_DB_PORT=3306
      - BZ_DB_USER=bugs
      - BZ_DB_NAME=bugs
      - BZ_DB_PASS=bugzilla
      - BZ_DATA_DIR=/var/www/html/data
      # Routes no Python module owns yet are forwarded to Perl.
      - PERL_REST_URL=http://bugzilla5.web/rest.cgi
    restart: unless-stopped

  bugzilla5.db:
    build:
      context: .
      dockerfile: Dockerfile.mariadb
    volumes:
      - bugzilla5-mysql-db:/var/lib/mysql
    tmpfs:
      - /tmp
      - /var/lock
    environment: *bugzilla_env

volumes:
  bugzilla5-mysql-db:
  bugzilla5-data-dir:
