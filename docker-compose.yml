services:
  bugzilla5.web:
    build:
      context: .
      dockerfile: Dockerfile
    command: /root/docker/startup.sh
    volumes:
      - bugzilla5-data-dir:/var/www/html/data
      - .:/mnt/sync
    tmpfs:
      - /tmp
      - /run/lock
    ports:
      - 8080:80
    depends_on:
      - bugzilla5.db
    environment: &bugzilla_env
      - BZ_ADMIN_EMAIL=admin@bugzilla.test
      - BZ_ADMIN_PASSWORD=password01!
      - BZ_ADMIN_REALNAME=Test Admin
      - BZ_URLBASE=http://127.0.0.1:8080/
      - BZ_DB_HOST=bugzilla5.db
      - BZ_DB_PORT=3306
      - BZ_DB_USER=bugs
      - BZ_DB_NAME=bugs
      - BZ_DB_PASS=bugzilla
      - MARIADB_ROOT_HOST=%
      - MARIADB_ROOT_PASSWORD=bugzilla
      # Set to http://bugzilla5.python:8000 to route the migrated REST routes to Python
      # (docker/python-proxy-routes.txt); empty = pure Perl.
      - BZ_PYTHON_UPSTREAM=${BZ_PYTHON_UPSTREAM:-}

  bugzilla5.python:
    build:
      context: ./python
      dockerfile: Dockerfile
    volumes:
      - bugzilla5-data-dir:/var/www/html/data:ro
      - ./python/app:/srv/app:ro
    ports:
      - 8000:8000
    depends_on:
      - bugzilla5.db
    environment:
      - BZ_DB_HOST=bugzilla5.db
      - BZ_DB_PORT=3306
      - BZ_DB_USER=bugs
      - BZ_DB_NAME=bugs
      - BZ_DB_PASS=bugzilla
      # unported /rest.cgi resources are forwarded back to Perl (strangler safety net)
      # set BZ_PERL_UPSTREAM= (empty) to disable the fallback, e.g. to prove Python alone serves the migrated routes
      - BZ_PERL_UPSTREAM=${BZ_PERL_UPSTREAM-http://bugzilla5.web:8081}

  bugzilla5.db:
    build:
      context: .
      dockerfile: Dockerfile.mariadb
    volumes:
      - bugzilla5-mysql-db:/var/lib/mysql
    tmpfs:
      - /tmp
      - /var/lock
    environment: *bugzilla_env

volumes:
  bugzilla5-mysql-db:
  bugzilla5-data-dir:
